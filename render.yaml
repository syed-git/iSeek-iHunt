services:
  - type: web
    name: iseek-ihunt
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: Asia/Kolkata
    disk:
      name: iseek-ihunt-data
      mountPath: /var/data
      sizeGB: 1
